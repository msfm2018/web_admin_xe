name: web_admin
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
    sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  simple_tree:
    path: ../
  # simple_tree: ^0.1.0
  cupertino_icons: ^1.0.8
  rxflare: ^1.1.7
  fl_chart: ^1.2.0
  particles_flutter: ^2.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/menu.json

  fonts:
    - family: Avenir
      fonts:
        - asset: assets/fonts/Avenir-Book.ttf
          weight: 400 # normal
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
