name: simple_tree
description: "A highly performant and reactive tree structure widget for Flutter, built with rxflare for efficient state management and rendering."
version: 1.1.2
homepage: https://github.com/msfm2018/simple_tree
repository: https://github.com/msfm2018/simple_tree

issue_tracker: https://github.com/msfm2018/simple_tree/issues
topics:
  - tree
  - treeview
  - reactive
  - performance
  - flutter-widgets

environment:
  sdk: '>=3.0.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  rxflare: ^1.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true


example: example/lib/main.dart
